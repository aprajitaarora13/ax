# Builds the pure prebuilt agent images under harnesses/ and the runner volume,
# and publishes them by digest. Prototype: this lives here until the harness
# recipes move to their own repository, with the same workflow.
name: harness-images

on:
  push:
    branches: [main]
    paths: ["harnesses/**", "Dockerfile.runner-volume", "cmd/ax-task-runner/**", "runner/**", "internal/metadata/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  runner-volume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the runner volume
        run: make push-runner-volume RUNNER_VOLUME_REPO=${REGISTRY}/ax-runner
      - name: Digest
        run: echo "${REGISTRY}/ax-runner@$(cat bin/ax-runner.digest)" >> "$GITHUB_STEP_SUMMARY"

  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        harness: [antigravity]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.harness }}
        run: make push-harness-image HARNESS=${{ matrix.harness }} HARNESS_REPO=${REGISTRY}/ax-harness-${{ matrix.harness }}
      - name: Check the image is pure (no AX runner inside)
        run: |
          img="${REGISTRY}/ax-harness-${{ matrix.harness }}:latest"
          if docker run --rm --entrypoint sh "$img" -c 'test -e /usr/local/bin/ax-task-runner'; then
            echo "harness image must not contain ax-task-runner" >&2; exit 1
          fi
          docker run --rm --entrypoint test "$img" -x /usr/local/bin/ax-harness
      - name: Digest
        run: echo "${REGISTRY}/ax-harness-${{ matrix.harness }}@$(cat bin/harness-${{ matrix.harness }}.digest)" >> "$GITHUB_STEP_SUMMARY"
